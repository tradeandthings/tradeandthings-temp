<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Trade &amp; Things</title>
    <meta
      name="description"
      content="Trade &amp; Things — A Touch of Luxury, Prestigious &amp; Elegant House. Our website is coming soon."
    />
    <meta name="theme-color" content="#ffffff" />

    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trade &amp; Things" />
    <meta
      property="og:description"
      content="Page under construction. We will be online very soon."
    />
    <meta property="og:url" content="https://tradeandthings.com" />
    <meta property="og:image" content="https://tradeandthings.com/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --green-light: #82cb27;
        --green: #52b209;
        --gray-dark: #2b2c2e;
        --gray-light: #6c6d71;
        --bg: #ffffff;
        --line: #e7e8e4;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        height: 100%;
      }
      body {
        min-height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--gray-dark);
        font-family:
          "Barlow",
          "DIN Alternate",
          "Segoe UI",
          system-ui,
          -apple-system,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      main {
        width: 100%;
        max-width: 720px;
        padding: 40px 24px 24px;
        text-align: center;
      }

      .logo {
        display: block;
        width: min(380px, 78vw);
        height: auto;
        margin: 0 auto clamp(28px, 6vh, 56px);
      }

      /* Heading: a green light sweeps across the text */
      h1 {
        margin: 0;
        font-size: clamp(2rem, 7.2vw, 3.6rem);
        font-weight: 600;
        line-height: 1.08;
        letter-spacing: 0.01em;
        background: linear-gradient(
          100deg,
          var(--gray-dark) 0%,
          var(--gray-dark) 38%,
          var(--green-light) 50%,
          var(--gray-dark) 62%,
          var(--gray-dark) 100%
        );
        background-size: 250% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: sweep 4.5s cubic-bezier(0.45, 0.05, 0.25, 1) 0.4s infinite;
      }
      @keyframes sweep {
        0% {
          background-position: 100% 0;
        }
        55%,
        100% {
          background-position: 0% 0;
        }
      }

      /* Two bars echo the stacked bars in the logo */
      .bars {
        width: min(220px, 60vw);
        margin: 26px auto 0;
        display: grid;
        gap: 8px;
      }
      .bars span {
        display: block;
        height: 6px;
        border-radius: 3px;
        transform-origin: left center;
        animation: draw 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .bars span:nth-child(1) {
        width: 100%;
        background: linear-gradient(90deg, #d6f08f, var(--green-light));
      }
      .bars span:nth-child(2) {
        width: 62%;
        background: linear-gradient(90deg, #bdf03e, var(--green));
        animation-delay: 0.25s;
      }
      @keyframes draw {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }

      .note {
        margin: 28px auto 0;
        max-width: 30em;
        font-size: clamp(1rem, 2.6vw, 1.15rem);
        line-height: 1.6;
        color: var(--gray-light);
      }

      .links {
        list-style: none;
        margin: 36px 0 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .links a {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border: 1px solid var(--line);
        border-radius: 12px;
        color: var(--gray-dark);
        background: #fff;
        text-decoration: none;
        font-weight: 500;
        font-size: 1rem;
        transition:
          transform 0.2s ease,
          background-color 0.2s ease,
          color 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .links svg {
        width: 20px;
        height: 20px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        color: var(--green);
        transition: color 0.2s ease;
      }
      .links a:hover,
      .links a:focus-visible {
        transform: translateY(-3px);
        background: var(--green);
        border-color: var(--green);
        color: #fff;
        box-shadow: 0 8px 20px -8px rgba(82, 178, 9, 0.55);
      }
      .links a:hover svg,
      .links a:focus-visible svg {
        color: #fff;
      }
      .links a:focus-visible {
        outline: 3px solid var(--green-light);
        outline-offset: 3px;
      }

      footer {
        padding: 20px 24px 28px;
        font-size: 0.9rem;
        color: var(--gray-light);
      }

      @media (max-width: 520px) {
        main {
          padding-top: 28px;
        }
        .links {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        .links a {
          justify-content: flex-start;
          padding: 12px 14px;
        }
        .links li:last-child:nth-child(odd) {
          grid-column: 1 / -1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        h1 {
          animation: none;
          background: none;
          -webkit-text-fill-color: currentColor;
          color: var(--gray-dark);
        }
        .bars span {
          animation: none;
        }
        .links a,
        .links a:hover {
          transition: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="logo"
        src="/mainlogo.png"
        width="1000"
        height="487"
        alt="Trade &amp; Things — A Touch of Luxury, Prestigious &amp; Elegant House"

      <h1>Page Under Construction</h1>
      <div class="bars" aria-hidden="true"><span></span><span></span></div>

        <li>

          <a href="mailto:tradeandthingsbd@gmail.com">
            <svg viewBox="0 0 24 24" aria-hidden="true">

          >

      </ul>
    </main>

    <footer>&copy; <span id="y">2026</span> Trade &amp; Things</footer>
    <script>
      document.getElementById("y").textContent = new Date().getFullYear();

  </body>
</html>
